apply plugin: 'com.android.application'

def generatedAssetsDir = file("$buildDir/generated/youshuAssets")

android {
    namespace 'com.youshu.budget'
    compileSdk 36

    defaultConfig {
        applicationId 'com.youshu.budget'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir generatedAssetsDir
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'app.js', 'core.js', 'ai-core.js', 'styles.css', 'favicon.svg'
    }
    into new File(generatedAssetsDir, 'www')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}
